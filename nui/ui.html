<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ari_garage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap"/>
  <link rel="stylesheet" href="css/app.css"/>
</head>
<body>

<div id="overlay" class="hidden">
  <div id="panel" role="dialog" aria-modal="true">

    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-icon">
          <i data-lucide="warehouse" aria-hidden="true"></i>
        </div>
        <div class="sidebar-titles">
          <span class="sidebar-resource">ari_garage</span>
          <span id="garage-label" class="sidebar-subtitle">Loading…</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-btn active" data-tab="garage">
          <i data-lucide="car-front" class="nav-icon" aria-hidden="true"></i>
          <span>Garage</span>
          <span class="nav-badge" id="badge-garage">0</span>
        </button>
        <button class="nav-btn" data-tab="impounded" id="tab-impounded">
          <i data-lucide="shield-alert" class="nav-icon" aria-hidden="true"></i>
          <span>Impounded</span>
          <span class="nav-badge warn" id="badge-impounded">0</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <span class="version-tag">v1.16.1-ari</span>
      </div>
    </aside>

    <main id="content">
      <div class="content-topbar">
        <div class="topbar-title-wrap">
          <h1 id="content-title">Garage</h1>
          <p class="topbar-subtitle" id="topbar-subtitle">Select a vehicle to retrieve</p>
        </div>
        <div class="topbar-actions">
          <div class="search-wrap">
            <i data-lucide="search" class="search-icon" aria-hidden="true"></i>
            <input id="search-input" type="search" placeholder="Search model or plate…" autocomplete="off" spellcheck="false"/>
          </div>
          <button id="btn-close" class="close-btn" title="Close (Esc)">
            <i data-lucide="x" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <p id="scroll-hint" class="scroll-hint hidden" aria-live="polite"></p>

      <div id="vehicle-grid" class="vehicle-grid"></div>

      <div id="empty-state" class="empty-state hidden">
        <i data-lucide="car" class="empty-icon" aria-hidden="true"></i>
        <p id="empty-msg">No vehicles stored here.</p>
      </div>
    </main>

  </div>
</div>

<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="nui://game/ui/jquery.js"></script>
<script src="js/app.js"></script>
</body>
</html>
